guardrails:
  - guardrail_name: memory-learnings
    litellm_params:
      guardrail: memory_guardrail.MemoryGuardrail
      mode: pre_call
  - guardrail_name: memory-learnings
    litellm_params:
      guardrail: memory_guardrail.MemoryGuardrail
      mode: post_call
  # Test-only: prefixes every reply with [MODEL_NAME]. Never touches the request, never
  # affects inference or tool calls, response text only. default_on runs it for every
  # request regardless of which router served it, so it is not attached per-router below.
  # Strip this block once you're past manual testing, since it puts a literal string into
  # every reply a real client would see clean.
  - guardrail_name: model-tag
    litellm_params:
      guardrail: model_tag_guardrail.ModelTagGuardrail
      mode: post_call
      default_on: true
  # Experiment 5: learning scoped to subtasks rather than to the whole ask.
  # embedding_model runs on the hot path (retrieval), so it must be fast.
  # extraction_model runs in the background after the response is already streaming, so it
  # can be slower and stronger.
  - guardrail_name: subtask-memory
    litellm_params:
      guardrail: subtask_memory_guardrail.SubtaskMemoryGuardrail
      mode: pre_call
      embedding_model: openai/text-embedding-3-small
      extraction_model: anthropic/claude-sonnet-5
  - guardrail_name: subtask-memory
    litellm_params:
      guardrail: subtask_memory_guardrail.SubtaskMemoryGuardrail
      mode: post_call
      embedding_model: openai/text-embedding-3-small
      extraction_model: anthropic/claude-sonnet-5

model_list:
  - model_name: "*"
    litellm_params:
      model: litellm_proxy/*
      api_base: os.environ/UPSTREAM_LITELLM_BASE_URL
      api_key: os.environ/UPSTREAM_LITELLM_API_KEY

  - model_name: moe-router
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_default_model: anthropic/claude-opus-5
      complexity_router_config:
        classifier_type: llm
        classifier_llm_config:
          model: anthropic/claude-haiku-4-5
          timeout_ms: 3000
          classification_rubric: agentic
        classifier_context_window_size: 35
        classifier_context_per_turn_chars: 500
        deployment_affinity: true
        session_affinity: false
        escalation_keywords:
          - LITELLM ESCALATE
        tiers:
          SIMPLE:
            - anthropic/claude-haiku-4-5
          MEDIUM:
            - anthropic/claude-sonnet-5
          COMPLEX:
            - model_name: anthropic/claude-opus-5
              litellm_params:
                reasoning_effort: high
          REASONING:
            - anthropic/claude-fable-5-1

  - model_name: moe-learning-router
    litellm_params:
      model: auto_router/complexity_router
      guardrails:
        - memory-learnings
      complexity_router_default_model: anthropic/claude-opus-5
      complexity_router_config:
        classifier_type: llm
        classifier_llm_config:
          model: anthropic/claude-haiku-4-5
          timeout_ms: 3000
          classification_rubric: agentic
        classifier_context_window_size: 35
        classifier_context_per_turn_chars: 500
        deployment_affinity: true
        session_affinity: false
        escalation_keywords:
          - LITELLM ESCALATE
        tiers:
          SIMPLE:
            - anthropic/claude-haiku-4-5
          MEDIUM:
            - anthropic/claude-sonnet-5
          COMPLEX:
            - model_name: anthropic/claude-opus-5
              litellm_params:
                reasoning_effort: high
          REASONING:
            - anthropic/claude-fable-5-1

  # Experiment 3: model per subtask TYPE. Tier names are arbitrary slots here, not a
  # difficulty ladder: SIMPLE is the explore model, COMPLEX the implement model, MEDIUM the
  # verify model. Models are picked for the kind of work, not its hardness.
  - model_name: moe-subtask-type-router
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_default_model: anthropic/claude-opus-5
      complexity_router_config:
        classifier_type: custom
        classifier_plugin: subtask_type_classifier.subtask_type_classifier
        classifier_plugin_timeout_ms: 500
        classifier_fallback: default_model
        deployment_affinity: true
        session_affinity: false
        escalation_keywords:
          - LITELLM ESCALATE
        tiers:
          # explore: long context and cheap input dominate; reading is not a reasoning task
          SIMPLE:
            - fireworks_ai/deepseek-v4-flash
          # verify: parsing test output, wants fast and cheap over smart
          MEDIUM:
            - anthropic/claude-haiku-4-5
          # implement: the one phase where a wrong answer is expensive
          COMPLEX:
            - model_name: anthropic/claude-opus-5
              litellm_params:
                reasoning_effort: high
          # unused by this classifier; kept so manual LITELLM ESCALATE has somewhere to go
          REASONING:
            - anthropic/claude-fable-5-1

  # Experiment 4: difficulty scored per subtask. Same built-in tiers as moe-router, so the
  # comparison against it isolates "what got classified" rather than "which models exist".
  - model_name: moe-subtask-difficulty-router
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_default_model: anthropic/claude-opus-5
      complexity_router_config:
        classifier_type: custom
        classifier_plugin: phase_difficulty_classifier.phase_difficulty_classifier
        classifier_plugin_timeout_ms: 500
        classifier_fallback: default_model
        deployment_affinity: true
        session_affinity: false
        escalation_keywords:
          - LITELLM ESCALATE
        tiers:
          SIMPLE:
            - anthropic/claude-haiku-4-5
          MEDIUM:
            - anthropic/claude-sonnet-5
          COMPLEX:
            - model_name: anthropic/claude-opus-5
              litellm_params:
                reasoning_effort: high
          REASONING:
            - anthropic/claude-fable-5-1

  # Experiment 5: subtask-scoped learning. Combines experiment 2 (subtask boundaries) with
  # experiment 1 (learned coverage): learnings are extracted per completed subtask and
  # retrieved by what the CURRENT subtask is doing, rather than by the session's opening ask.
  # The guardrail writes coverage into request metadata; the classifier reads it on the same
  # request and discounts the tier when the work is already covered.
  - model_name: moe-subtask-memory-router
    litellm_params:
      model: auto_router/complexity_router
      guardrails:
        - subtask-memory
      complexity_router_default_model: anthropic/claude-opus-5
      complexity_router_config:
        classifier_type: custom
        classifier_plugin: subtask_memory_classifier.subtask_memory_classifier
        classifier_plugin_timeout_ms: 500
        classifier_fallback: default_model
        deployment_affinity: true
        session_affinity: false
        escalation_keywords:
          - LITELLM ESCALATE
        tiers:
          SIMPLE:
            - anthropic/claude-haiku-4-5
          MEDIUM:
            - anthropic/claude-sonnet-5
          COMPLEX:
            - model_name: anthropic/claude-opus-5
              litellm_params:
                reasoning_effort: high
          REASONING:
            - anthropic/claude-fable-5-1

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  telemetry: false
