databases:
  - name: autorouter-sandbox-db
    plan: free
    region: oregon

services:
  - type: web
    name: litellm-autorouter-sandbox
    runtime: docker
    plan: standard
    region: oregon
    autoDeploy: true
    dockerfilePath: ./deploy/autorouter-sandbox/Dockerfile
    dockerContext: .
    healthCheckPath: /health/liveliness
    disk:
      name: autorouter-sandbox-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "4000"
      - key: UPSTREAM_LITELLM_BASE_URL
        value: https://gateway.litellm-sandbox.ai
      - key: UPSTREAM_LITELLM_API_KEY
        sync: false
      - key: LITELLM_MASTER_KEY
        generateValue: true
      - key: MEMORY_STORE_DIR
        value: /var/data/memory
      - key: SUBTASK_MEMORY_STORE_DIR
        value: /var/data/subtask_memory
      - key: DATABASE_URL
        fromDatabase:
          name: autorouter-sandbox-db
          property: connectionString
      - key: LITELLM_SALT_KEY
        generateValue: true
